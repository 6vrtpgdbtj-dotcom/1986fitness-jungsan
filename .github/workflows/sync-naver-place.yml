name: Sync Naver Content

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-place-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:naver
      - run: npm test
      - name: Commit valid content changes
        run: |
          if git diff --quiet -- data/place-feed.json assets/live; then
            echo "No Place changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/place-feed.json assets/live
          git commit -m "chore: sync Naver Place content"
          git push
